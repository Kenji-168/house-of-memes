<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Dancing Baby museum illustration</title>
  <desc id="desc">A stylized 3D baby dancing in an ornate museum frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1a23"/>
      <stop offset="100%" stop-color="#2a2a34"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d8c198"/>
      <stop offset="50%" stop-color="#c5a46d"/>
      <stop offset="100%" stop-color="#a78552"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4d7bf"/>
      <stop offset="100%" stop-color="#e8bf9e"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d7a5c6"/>
      <stop offset="100%" stop-color="#915a8b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="26" y="26" width="548" height="348" rx="14" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="42" y="42" width="516" height="316" rx="10" fill="#14141a" opacity="0.7"/>

  <g filter="url(#shadow)">
    <g transform="translate(300 205)">
      <ellipse cx="0" cy="88" rx="110" ry="18" fill="#000000" opacity="0.2"/>
      <g transform="rotate(-12)">
        <circle cx="0" cy="-78" r="46" fill="url(#skin)"/>
        <circle cx="-12" cy="-84" r="5" fill="#1a1a1a"/>
        <circle cx="14" cy="-84" r="5" fill="#1a1a1a"/>
        <path d="M-18 -64 Q0 -52 18 -64" fill="none" stroke="#8c5b4d" stroke-width="4" stroke-linecap="round"/>
        <path d="M-20 0 Q-14 20 0 25 Q14 20 20 0" fill="none" stroke="#8c5b4d" stroke-width="3" stroke-linecap="round"/>
        <path d="M-23 -12 L-75 5" stroke="#f3d7bf" stroke-width="16" stroke-linecap="round"/>
        <path d="M24 -12 L78 -26" stroke="#f3d7bf" stroke-width="16" stroke-linecap="round"/>
        <path d="M-22 12 L-60 62" stroke="#f3d7bf" stroke-width="18" stroke-linecap="round"/>
        <path d="M18 12 L72 80" stroke="#f3d7bf" stroke-width="18" stroke-linecap="round"/>
        <ellipse cx="0" cy="16" rx="58" ry="52" fill="url(#shirt)"/>
        <circle cx="-24" cy="20" r="8" fill="#f4d7bf"/>
        <circle cx="24" cy="20" r="8" fill="#f4d7bf"/>
        <path d="M-58 38 L-46 70 L-18 88" stroke="#f3d7bf" stroke-width="18" stroke-linecap="round"/>
        <path d="M58 38 L46 74 L14 92" stroke="#f3d7bf" stroke-width="18" stroke-linecap="round"/>
        <path d="M-2 80 L-38 130" stroke="#f3d7bf" stroke-width="18" stroke-linecap="round"/>
        <path d="M2 80 L36 130" stroke="#f3d7bf" stroke-width="18" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g opacity="0.3">
    <path d="M128 114 L201 67 M470 112 L420 64" stroke="#d4b67f" stroke-width="2" fill="none"/>
    <path d="M135 278 L205 310 M465 278 L398 314" stroke="#d4b67f" stroke-width="2" fill="none"/>
  </g>
</svg>
